# Reference:
#https://github.com/pioarduino/platform-espressif32/blob/develop/examples/espidf-arduino-blink/platformio.ini

[platformio]
default_envs = esp32dev
src_dir = main

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32dev
framework = espidf

; Auch PlatformIO muss die in sdkconfig ausgewaehlte Tabelle verwenden.
; Ohne diese Angabe erzeugt sein Builder partitions_singleapp.csv (nur 1 MiB).
board_build.partitions = partitions_singleapp_large_coredump.csv
; Vor inkrementellen Builds eingebettetes HTML aktualisieren (kein Download).
extra_scripts = pre:scripts/embed_web.py

; USB-Verbindung zum ESP32
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_speed = 115200
monitor_filters = direct
